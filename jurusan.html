<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="jurusan.css">  
    <title>Penggunaan Objek select</title>
</head>
<body>
    <header>Penggunaan Objek select</header>
    <form>
        <fieldset>
            <legend>Masukkan:</legend>
            <div>
                <label for="Jurusan di UNIKOM">Jurusan di UNIKOM :</label> <br />
                <select id="Jurusan di UNIKOM" name="jurusan" required>
                    <option value="">Pilih Jurusan</option>
                    <option value="Teknik Informatika">Teknik Informatika</option>
                    <option value="Manajemen Informatika">Manajemen Informatika</option>
                    <option value="Teknik Komputer">Teknik Komputer</option>
                    <option value="Teknik Industri">Teknik Industri</option>
                    <option value="Teknik Elektro">Teknik Elektro</option>
                    <option value="Teknik Sipil">Teknik Sipil</option>
                    <option value="Teknik Sipil">Teknik Sipil</option>
                    <option value="Teknik Arsitektur">Teknik Arsitektur</option>
                    <option value="Perencanaan Wil.Kota">Perencanaan Wil.Kota</option>
                </select>
            </div>

             <p>
                <input type="submit" name="Kirim" value="Kirim" /> 
                <input type="reset" name="Ulang" value="Ulang" /> 
            </p>

            <div>
                <label>Output Jurusan :</label> <br />
                <input type="text" name="Output-Jurusan" /> <br />
            </div>
        </fieldset>
    </form>
</body>
</html>
