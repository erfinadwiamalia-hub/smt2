<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
   <link rel="stylesheet" href="jurusan.css">
    <title>Penggunaan Objek Select</title>
</head>
<body>

<header>Penggunaan Objek Select</header>

<form>
    <fieldset>
        <legend>Masukkan:</legend>

        <label for="jurusan">Jurusan di UNIKOM :</label>
        <select id="jurusan" name="jurusan" required>
            <option value="">Pilih Jurusan</option>
            <option value="Teknik Informatika">Teknik Informatika</option>
            <option value="Manajemen Informatika">Manajemen Informatika</option>
            <option value="Teknik Komputer">Teknik Komputer</option>
            <option value="Teknik Industri">Teknik Industri</option>
            <option value="Teknik Elektro">Teknik Elektro</option>
            <option value="Teknik Sipil">Teknik Sipil</option>
            <option value="Teknik Arsitektur">Teknik Arsitektur</option>
            <option value="Perencanaan Wilayah Kota">Perencanaan Wilayah Kota</option>
        </select>

        <label>Output Jurusan :</label>
        <input type="text" id="output" readonly>

        <input type="submit" value="Kirim" class="btn">
        <input type="reset" value="Ulang" class="btn">
    </fieldset>
</form>

<script>
    const jurusan = document.getElementById("jurusan");
    const output = document.getElementById("output");

    jurusan.addEventListener("change", function() {
        output.value = jurusan.value;
    });
</script>

</body>
</html>
