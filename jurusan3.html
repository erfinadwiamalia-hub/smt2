<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Penggunaan Objek Select</title>
    <style>
        body {
            font-family: 'Times New Roman', sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        .container {
            display: inline-block;
            text-align: left;
        }
        h1 {
            text-align: center;
        }
        select, input {
            padding: 5px;
            margin-top: 10px;
        }
        button {
            margin-top: 10px;
            padding: 5px 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Penggunaan Objek Select</h1>
        <hr>

        <p><b>Masukan :</b></p>

        <label>Jurusan Di UNIKOM :</label>
        <select id="jurusan">
            <option value="pilih-jurusan">Pilih Jurusan</option>
            <option value="Teknik Informatika">Teknik Informatika</option>
            <option value="Manajemen Informatika">Manajemen Informatika</option>
            <option value="Teknik Komputer">Teknik Komputer</option>
            <option value="Teknik Industri">Teknik Industri</option>
            <option value="Teknik Elektro">Teknik Elektro</option>
            <option value="Teknik Sipil">Teknik Sipil</option>
            <option value="Teknik Arsitektur">Teknik Arsitektur</option>
            <option value="Perencanaan Wilayah Kota">Perencanaan Wilayah Kota</option>
        </select>

        <br>

        <button onclick="kirim()">kirim</button>
        <button onclick="ulang()">ulang</button>

        <p><b>Output jurusan :</b></p>
        <input type="text" id="output" readonly>

    </div>

    <script>
        function kirim() {
            let jurusan = document.getElementById("jurusan").value;
            document.getElementById("output").value = jurusan;
        }

        function ulang() {
            document.getElementById("jurusan").selectedIndex = 0;
            document.getElementById("output").value = "";
        }
    </script>

</body>
</html>
