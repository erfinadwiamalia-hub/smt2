<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>latihan DOM</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: aliceblue;
            padding: 80px;
            max-width: 600px;
            margin: 0 auto;
        }
        .container {
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        button {
            padding: 10px 20px;
            background-color: rgb(135, 182, 226);
            color: white;
            border: none;
            border-radius: 2px;
            cursor: pointer;
        }
        form {
            margin-top: 20px;
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        img {
            margin-top: 10px;
            border-radius: 5px;
        }
    </style>
</head>

<body>
    <h1 id="judul">Halaman Home</h1>
    <p id="paragraf">Selamat Datang</p>
    <button id="btnUbah">Ubah Tampilan</button>

    <form>
        <fieldset>
            <legend>Form Data</legend>

            <div>
                <label>Masukkan Nama:</label><br>
                <input type="text" id="nama" required>
            </div>

            <div>
                <label>Masukkan Nomor Telepon:</label><br>
                <input type="tel" id="telepon" required>
            </div>

            <div>
                <label>Upload Gambar:</label><br>
                <input type="file" id="image" accept="image/*">
            </div>

            <p>
                <button type="submit">Kirim</button>
                <button type="reset">Reset</button>
            </p>
        </fieldset>
    </form>

    <div class="box" id="hasil">
        <h3>Hasil Laporan</h3>
        <p id="outNama"></p>
        <img id="preview" width="150" style="display:none;">
    </div>

<script>
const btnUbah = document.getElementById("btnUbah");
const judul = document.getElementById("judul");
const paragraf = document.getElementById("paragraf");

const form = document.querySelector("form");
const inputNama = document.getElementById("nama");
const inputTelepon = document.getElementById("telepon");
const inputImage = document.getElementById("image");

const outNama = document.getElementById("outNama");
const preview = document.getElementById("preview");

// tombol ubah tampilan
btnUbah.addEventListener("click", function() {
    judul.textContent = "Halaman Admin";
    paragraf.textContent = "Selamat Siang Admin";
    judul.style.color = "blue";
    paragraf.style.color = "blue";
    btnUbah.style.backgroundColor = "blue";
    document.body.style.backgroundColor = "yellow";
});

// submit form
form.addEventListener("submit", function(event) {
    event.preventDefault();

    const nama = inputNama.value;
    const telepon = inputTelepon.value;

    outNama.textContent = "Nama: " + nama + " | No HP: " + telepon;

    // ambil gambar
    const file = inputImage.files[0];

    if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            preview.src = e.target.result;
            preview.style.display = "block";
        };
        reader.readAsDataURL(file);
    }
});
</script>

</body>
</html>
