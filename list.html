<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>To Do List DOM</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f8ff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }


        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 350px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            text-align: center;
        }


        h1 {
            margin-bottom: 20px;
        }


        input, select, button {
            padding: 10px;
            margin: 5px;
            width: 90%;
        }


        p {
            margin-top: 20px;
            padding: 0;
        }


        p {
            list-style: none;
            background: #f9f9f9;
            margin: 8px 0;
            padding: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }


       
        .penting-mendesak {
            border-left: 6px solid rgb(248, 192, 243);
        }


        .penting {
            border-left: 6px solid rgb(210, 182, 236);
        }


        .mendesak {
            border-left: 6px solid rgb(177, 218, 235);
        }


        .selesai {
            text-decoration: line-through;
            color: rgb(230, 14, 14);
        }


        button {
            cursor: pointer;
            width: auto;
            right: 7px;
        }
    </style>
</head>
<body>


    <div class="container">
        <h1>To Do List</h1>


        <select id="kategori">
            <option value="Penting & Mendesak">Penting & Mendesak</option>
            <option value="Penting">Penting tapi Tidak Mendesak</option>
            <option value="Mendesak">Kurang Penting tapi Mendesak</option>
        </select>


        <input type="text" id="inputTugas" placeholder="Masukkan tugas">


        <button id="tambahBtn">Tambah</button>

        <div id="listTugas"></div>
        
    </div>


    <script>
        const input = document.getElementById("inputTugas");
        const kategori = document.getElementById("kategori");
        const tombol = document.getElementById("tambahBtn");
        const list = document.getElementById("listTugas");


        tombol.addEventListener("click", function() {
            const teks = input.value;
            const pilihKategori = kategori.value;


            if (teks === "") {
                alert("Tugas tidak boleh kosong!");
                return;
            }


            const item = document.createElement("p");
            item.textContent = teks + " (" + pilihKategori + ")";


            if (pilihKategori === "Penting & Mendesak") {
                item.classList.add("penting-mendesak");
            } else if (pilihKategori === "Penting") {
                item.classList.add("penting");
            } else {
                item.classList.add("mendesak");
            }


            const hapusBtn = document.createElement("button");
            hapusBtn.textContent = "Hapus";


            hapusBtn.addEventListener("click", function() {
                item.remove();
            });


            item.addEventListener("click", function() {
                item.classList.toggle("selesai");
            });


            item.appendChild(hapusBtn);
            list.appendChild(item);


            input.value = "";
        });
    </script>


</body>
</html>
