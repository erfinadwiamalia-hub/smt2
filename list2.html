<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>To Do List DOM</title>
    <link rel ="stylesheet" href="list2.css">

</head>
<body>

<div class="container"> 
    <h1>To Do List</h1> 
    <select id="kategori">
    
        <option value="Penting & Mendesak">Penting & Mendesak</option> 
        <option value="Penting">Penting tapi Tidak Mendesak</option>
        <option value="Mendesak">Kurang Penting tapi Mendesak</option>
    </select>

    <input type="text" id="inputTugas" placeholder="Masukkan tugas"> 

    <button id="tambahBtn">Tambah</button> 
    <div id="listTugas"></div> 
</div>

<script src="list2.js"></script>
</body>
</html>
